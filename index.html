<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>邪推</title>
<style>
:root{--bg:#050505;--fg:#f4f4f1;--muted:rgba(255,255,255,.52);--line:rgba(255,255,255,.09);--gap:clamp(20px,4vw,64px);--pad:clamp(18px,6vw,88px);--ph:min(84dvh,900px)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
body{overscroll-behavior:none}.viewport{width:100vw;height:100dvh;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}.viewport::-webkit-scrollbar{display:none}
.track{height:100%;min-width:max-content;display:flex;align-items:center;gap:var(--gap);padding:0 var(--pad)}
.panel{flex:0 0 auto;height:100dvh;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;scroll-snap-stop:always;position:relative;width:min(82vw,920px)}
.cover{width:min(92vw,1120px)}.page img,.cover img{display:block;height:var(--ph);width:auto;max-width:min(84vw,960px);object-fit:contain;box-shadow:0 18px 50px rgba(0,0,0,.32);background:#111;user-select:none;-webkit-user-drag:none}
.blank{width:min(42vw,420px)}.blank::after{content:"";display:block;width:min(28vw,250px);height:min(48vh,380px);border:1px solid rgba(255,255,255,.035)}
.hint{position:absolute;right:0;bottom:max(18px,env(safe-area-inset-bottom));font-size:11px;letter-spacing:.18em;color:var(--muted);animation:pulse 2.2s ease-in-out infinite;white-space:nowrap}
@keyframes pulse{0%,100%{opacity:.45;transform:translateX(0)}50%{opacity:1;transform:translateX(7px)}}
.ui{position:fixed;left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:5;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.counter{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:999px;background:rgba(0,0,0,.42);border:1px solid var(--line);backdrop-filter:blur(10px);font-size:11px;letter-spacing:.1em}.bar{width:min(30vw,260px);height:2px;background:rgba(255,255,255,.12);overflow:hidden;border-radius:99px}.bar i{display:block;height:100%;width:0;background:rgba(255,255,255,.85)}
.nav{display:flex;gap:8px}.nav button{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.42);color:var(--fg);font-size:19px;backdrop-filter:blur(10px)}
@media(max-width:760px){:root{--ph:min(72dvh,78vw);--gap:20px;--pad:14px}.panel{width:calc(100vw - 28px)}.cover{width:calc(100vw - 18px)}.page img,.cover img{max-width:calc(100vw - 28px)}.bar{width:34vw}.blank{width:42vw}}
@media(prefers-reduced-motion:reduce){.hint{animation:none}.viewport{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="viewport" id="viewport"><main class="track" id="track"></main></div>
<div class="ui">
  <div class="counter"><span id="label">COVER</span><span class="bar"><i id="bar"></i></span><span id="count">1 / 134</span></div>
  <div class="nav"><button id="prev" aria-label="previous">‹</button><button id="next" aria-label="next">›</button></div>
</div>
<script>
const pages = Array.from({length:134},(_,i)=>({page:i+1,file:`p${String(i+1).padStart(3,'0')}.webp`}));
const blankPages=new Set([2,19,29,36,56,103,113,114,115,125,131,133]);
const track=document.getElementById('track');
for(const p of pages){
  const sec=document.createElement('section'); sec.className='panel'; sec.dataset.index=p.page;
  if(p.page===1){sec.classList.add('cover'); sec.innerHTML=`<img src="assets/${p.file}" alt="邪推 表紙"><div class="hint">SWIPE / SCROLL →</div>`}
  else if(blankPages.has(p.page)){sec.classList.add('blank'); sec.setAttribute('aria-label',`page ${p.page}`)}
  else {sec.classList.add('page'); sec.innerHTML=`<img src="assets/${p.file}" alt="邪推 page ${p.page}" loading="lazy" decoding="async">`}
  track.appendChild(sec)
}
const vp=document.getElementById('viewport'), panels=[...document.querySelectorAll('.panel')], label=document.getElementById('label'), count=document.getElementById('count'), bar=document.getElementById('bar'); let active=0,raf=0;
function setActive(i){active=Math.max(0,Math.min(i,panels.length-1));label.textContent=active===0?'COVER':String(active+1).padStart(3,'0');count.textContent=`${active+1} / ${panels.length}`;bar.style.width=`${((active+1)/panels.length)*100}%`;document.getElementById('prev').style.opacity=active===0?.35:1;document.getElementById('next').style.opacity=active===panels.length-1?.35:1}
function closest(){const c=vp.scrollLeft+vp.clientWidth/2;let bi=0,bd=1e12;panels.forEach((p,i)=>{const d=Math.abs((p.offsetLeft+p.offsetWidth/2)-c);if(d<bd){bd=d;bi=i}});return bi}
vp.addEventListener('scroll',()=>{if(raf)return;raf=requestAnimationFrame(()=>{setActive(closest());raf=0})},{passive:true});
vp.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();vp.scrollLeft+=e.deltaY}},{passive:false});
function go(i){panels[Math.max(0,Math.min(i,panels.length-1))].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}
next.onclick=()=>go(active+1);prev.onclick=()=>go(active-1);window.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(active+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(active-1)}else if(e.key==='Home'){go(0)}else if(e.key==='End'){go(panels.length-1)}});setActive(0);
</script>
</body></html>
